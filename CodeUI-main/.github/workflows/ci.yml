name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  no-python:
    name: No Python in repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if any .py file is tracked
        run: |
          matches=$(git ls-files '*.py')
          if [ -n "$matches" ]; then
            echo "Forbidden Python files:"
            echo "$matches"
            exit 1
          fi
          echo "Repository is clean."

  rust:
    name: Rust (clippy + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            default-jdk \
            python3

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Verify no orphaned processes were left behind
        run: |
          leaked=$(pgrep -f 'codeui-' || true)
          if [ -n "$leaked" ]; then
            echo "Leaked processes after the test run:"
            ps -o pid,cmd -p $leaked
            exit 1
          fi
          echo "No orphaned processes."

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether the frontend exists yet
        id: probe
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No package.json yet - skipping until the frontend lands."
          fi

      - uses: actions/setup-node@v4
        if: steps.probe.outputs.present == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install and test
        if: steps.probe.outputs.present == 'true'
        run: |
          npm ci
          npm test
          npm run build

      - name: Verify bundled font in build output
        if: steps.probe.outputs.present == 'true'
        run: |
          find dist/assets -name "CodeUI-Mono-*.ttf" | grep -q "." || (echo "Bundled CodeUI-Mono font missing from dist/assets!" && exit 1)
          echo "Build assets verified."

  windows:
    name: Windows (Rust + Tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Backend Tests
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Frontend Tests
        run: |
          npm ci
          npm test
