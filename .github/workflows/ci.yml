name: CI

on:
  push:
    branches: [main, dev, "stabilize/*"]
  pull_request:
    branches: [main, dev, "stabilize/*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    name: Repository Hygiene (No Python tracked, No conflict markers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if any .py file is tracked
        run: |
          matches=$(git ls-files '*.py')
          if [ -n "$matches" ]; then
            echo "Forbidden Python files tracked in repository:"
            echo "$matches"
            exit 1
          fi
          echo "No tracked Python files found."

      - name: Fail if any merge conflict markers exist in tracked files
        run: |
          if git grep -I -n -E '^(<{7}|={7}|>{7}) ' -- ':!*.md' ':!.github/*' ':!.githooks/*'; then
            echo "Unresolved merge conflict markers detected!"
            exit 1
          fi
          echo "No merge conflict markers found."

  linux:
    name: Linux (Ubuntu 22.04 - Clippy, Tests & Verification)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            default-jdk \
            python3

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Verify manifest versions are in sync
        run: cargo run -p xtask -- version-sync

      - name: Verify no conflict markers in source tree
        run: cargo run -p xtask -- check-conflicts

      - name: Clippy (0 warnings permitted)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Backend Tests
        run: cargo test --workspace

      - name: Verify no orphaned processes were left behind
        run: |
          leaked=$(pgrep -f 'codeui-' || true)
          if [ -n "$leaked" ]; then
            echo "Leaked processes after the test run:"
            ps -o pid,cmd -p $leaked
            exit 1
          fi
          echo "No orphaned processes."

  frontend:
    name: Frontend (Node 20 - Tests, Build & Asset Verification)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Compile and bundle frontend
        run: npm run build

      - name: Verify bundled font in build output
        run: |
          find dist/assets -name "CodeUI-Mono-*.ttf" | grep -q "." || (echo "Bundled CodeUI-Mono font missing from dist/assets!" && exit 1)
          echo "Build assets verified."

  windows:
    name: Windows (Windows Latest - Backend & Frontend Tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Backend Tests
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend Tests
        run: npm test

  macos:
    name: macOS (macOS Latest - Backend & Frontend Tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Backend Tests
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend Tests
        run: npm test
