name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis,msi'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage,deb'
          - platform: 'macos-latest'
            args: '--bundles dmg'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            build-essential
          # The bundled Salivo compiler links libLLVM-16; linuxdeploy must be able to resolve it.
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 16

      - name: Verify manifest versions are in sync
        run: cargo run -p xtask -- version-sync

      - name: Install frontend dependencies
        run: npm ci

      # The Salivo SDK (compiler binaries + std, no compiler sources) ships inside the app.
      # Archives come from Salivo's SDK workflow and are attached to the release below.
      - name: Bundle Salivo SDK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SALIVO_SDK_TAG: salivo-sdk-v1.0.16
        run: |
          case "${{ matrix.platform }}" in
            windows-*) pattern='*-windows-x64.zip' ;;
            ubuntu-*)  pattern='*-linux-x64.tar.gz' ;;
            macos-*)   pattern='*-macos-arm64.tar.gz' ;;
          esac
          gh release download "$SALIVO_SDK_TAG" -R "$GITHUB_REPOSITORY" -p "$pattern" -D sdk-download
          mkdir -p sdk-extract src-tauri/resources/salivo-sdk
          archive=$(ls sdk-download/*)
          case "$archive" in
            *.zip) unzip -q "$archive" -d sdk-extract ;;
            *)     tar -xzf "$archive" -C sdk-extract ;;
          esac
          sdk=$(ls -d sdk-extract/*/)
          cp -R "$sdk"bin "$sdk"std "$sdk"lib "$sdk"stage3 "$sdk"LICENSE src-tauri/resources/salivo-sdk/
          # sf links LLVM dynamically on Linux and macOS; ship the library so users need no LLVM install.
          case "${{ matrix.platform }}" in
            ubuntu-*)
              cp -L /usr/lib/llvm-16/lib/libLLVM-16.so.1 src-tauri/resources/salivo-sdk/lib/
              ;;
            macos-*)
              brew install llvm@16 dylibbundler
              cd src-tauri/resources/salivo-sdk
              dylibbundler -od -b -x bin/sf -d lib/ -p @executable_path/../lib/
              codesign -f -s - bin/sf lib/*.dylib
              otool -L bin/sf
              cd -
              ;;
          esac
          ls src-tauri/resources/salivo-sdk/bin src-tauri/resources/salivo-sdk/lib

      - name: Build and release Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=6144"
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.1.0-{0}', github.run_number) }}
          releaseName: 'CodeUI v__VERSION__'
          releaseBody: |
            ## CodeUI Release v__VERSION__
            
            Lightweight, lab-safe code editor with Monaco Editor, integrated terminal emulator, and multi-language toolchain runners.
            
            ### Downloads
            - **Windows**: `CodeUI___VERSION___x64-setup.exe` (User / System Setup Wizard) or `CodeUI___VERSION___x64_en-US.msi`
            - **Linux**: `CodeUI___VERSION___amd64.AppImage` or `CodeUI___VERSION___amd64.deb`
            - **macOS**: `CodeUI___VERSION____x64.dmg` or `CodeUI___VERSION____aarch64.dmg`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Publish SHA256 checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.1.0-{0}', github.run_number) }}
        run: |
          files=$(ls target/release/bundle/*/*.{exe,msi,AppImage,deb,dmg} src-tauri/target/release/bundle/*/*.{exe,msi,AppImage,deb,dmg} 2>/dev/null || true)
          if [ -z "$files" ]; then echo "No release bundles were produced"; exit 1; fi
          sums="SHA256SUMS-${{ matrix.platform }}.txt"
          for f in $files; do
            if command -v sha256sum >/dev/null; then sha256sum "$f"; else shasum -a 256 "$f"; fi
          done | sed "s#  .*/#  #" > "$sums"
          cat "$sums"
          gh release upload "$TAG" "$sums" --clobber

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codeui-${{ matrix.platform }}-bundles
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
