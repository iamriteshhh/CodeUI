name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis,msi'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage,deb'
          - platform: 'macos-latest'
            args: '--bundles dmg'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'CodeUI v__VERSION__'
          releaseBody: |
            ## CodeUI Release v__VERSION__
            
            Lightweight, high-performance code editor with Monaco Editor, integrated terminal emulator, and multi-language toolchain runners.
            
            ### Downloads
            - **Windows**: `CodeUI___VERSION___x64-setup.exe` (User / System Setup Wizard) or `.msi`
            - **Linux**: `codeui___VERSION___amd64.AppImage` or `.deb`
            - **macOS**: `CodeUI___VERSION____x64.dmg`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
