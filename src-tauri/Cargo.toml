[package]
name = "codeui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CodeUI - a lab-safe IDE for students"

[lib]
name = "codeui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
which = "6"
dirs = "5"
rfd = "0.17.2"
walkdir = "2"
# proxy-from-env: honour http(s)_proxy. native-certs: trust the OS certificate store, so a
# network whose firewall inspects HTTPS (with its CA installed on the machine) still works.
ureq = { version = "2", features = ["json", "proxy-from-env", "native-certs"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Job Objects for the exec-phase sandbox (already in the tree via tauri).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
which = "6"
